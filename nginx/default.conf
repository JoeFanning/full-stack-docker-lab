# Your NGINX container was acting as a simple pass-through on port 8081, but in a real-world production environment, 
# NGINX does much more: it handles security headers, routes API paths cleanly, compresses responses, and manages SSL/TLS certificates.

server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Route API traffic to your FastAPI backend container
    location /api/ {
        proxy_pass http://app:8000/;  # 'app' matches your docker-compose service name
        
        # Essential proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for long-running API requests
        proxy_read_timeout 90s;
    }

    # Serve static frontend files or a landing page if you have one
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }
}
